<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contact.</title>
    <meta name="description" content="Matt — web developer and Business Analytics &amp; AI grad student at Stevens. Projects, background, and contact info.">
    <meta name="theme-color" content="#323231">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700&family=Montserrat:wght@400;700&family=Sriracha&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>

    <header class="header">
        <nav class="header-buttons-container" aria-label="Main">
            <button id="logo-button" class="header-image-button" type="button" aria-label="Logo">
                <img src="images/Icon_Skill_ak12_buff.png" alt="" width="100" height="100" class="header-image">
            </button>

            <a href="index.html" class="header-button">Home</a>
            <a href="about.html" class="header-button">About</a>
            <a href="projects.html" class="header-button">Projects</a>
            <a href="contact.html" class="header-button" aria-current="page">Contact</a>
        </nav>
    </header>

    <main id="page-content">

        <div class="grid4r1c">
            <a href="https://www.linkedin.com/in/mc917/">
                <h1>linkedIn</h1>
            </a>

            <a href="https://github.com/OreoJuice">
                <h1>GitHub</h1>
            </a>

            <a href="nonImageFiles/Matthew_Calora_Resume.pdf" download>
                <h1>Download CV / Resume</h1>
            </a>
        </div>

        <section class="contact-form-section" aria-labelledby="contact-form-title">
            <h1 id="contact-form-title">Send Me a Message</h1>

            <!-- works without JS too (Formspree shows its own thank-you page); app.js sends it in the background -->
            <form id="contact-form" class="contact-form" action="https://formspree.io/f/mvkkkdwk" method="POST">
                <label for="contact-name">Name</label>
                <input id="contact-name" name="name" type="text" autocomplete="name" required>

                <label for="contact-email">Your Email</label>
                <input id="contact-email" name="email" type="email" autocomplete="email" required>

                <label for="contact-subject">Subject</label>
                <input id="contact-subject" name="_subject" type="text" required>

                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" rows="6" required></textarea>

                <!-- spam trap: real visitors never see or fill this -->
                <input type="text" name="_gotcha" class="contact-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

                <button type="submit" class="contact-submit">Send Message</button>
                <p class="contact-status" role="status" aria-live="polite"></p>
            </form>
        </section>

    </main>

    <footer class="footer">last updated October 26, 2026</footer>

</body>
</html>
